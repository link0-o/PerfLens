[workspace]
members = [
    "rust/perflens-container-gate",
    "rust/perflens-privileged-helper",
    "rust/perflens-trace-helper",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/link0-o/PerfLens"

[workspace.dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "signal", "socket", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
