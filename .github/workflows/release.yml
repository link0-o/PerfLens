name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian-package:
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 30
    steps:
      - name: Install Debian build prerequisites
        run: >-
          apt-get update && apt-get install --yes
          ca-certificates dpkg-dev git linux-perf python3
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen --python /usr/bin/python3
      - run: uv build --no-sources
      - run: >-
          uv run python scripts/build_deb.py
          --output-directory dist
          --python /usr/bin/python3
          --uv "$(command -v uv)"
      - run: mkdir /tmp/perflens-deb-reproducible
      - run: >-
          uv run python scripts/build_deb.py
          --output-directory /tmp/perflens-deb-reproducible
          --python /usr/bin/python3
          --uv "$(command -v uv)"
          --offline
      - run: >-
          uv run python tests/deb_package_smoke.py
          --directory dist
          --reproducible-directory /tmp/perflens-deb-reproducible
      - name: Install and remove DEBs without activating Collector
        run: |
          apt-get install --yes --no-install-recommends \
            ./dist/perflens_*_amd64.deb \
            ./dist/perflens-collector_*_all.deb
          perflens --version
          perflens-admin --version
          mkdir /tmp/perflens-installed-preflight
          perflens setup \
            --project /tmp/perflens-installed-preflight \
            --prepare-collector \
            --automatic-collection \
            --collector-uid 65534 \
            --perf-path /usr/bin/perf
          grep -F "ExecStart=/usr/bin/perflens-collector" \
            /tmp/perflens-installed-preflight/perflens-setup/collector-assets/perflens-collector.service
          grep -F "/usr/bin/perflens-admin deploy" \
            /tmp/perflens-installed-preflight/perflens-setup/下一步.zh-CN.md
          grep -F -- \
            "--setup-directory /tmp/perflens-installed-preflight/perflens-setup" \
            /tmp/perflens-installed-preflight/perflens-setup/下一步.zh-CN.md
          perflens-admin deploy \
            --config /tmp/perflens-installed-preflight/perflens-setup/collector-assets/collector.toml \
            --dry-run | grep -F "尚未修改系统"
          test ! -e /etc/perflens/collector.toml
          test ! -e /etc/systemd/system/perflens-collector.service
          apt-get remove --yes perflens-collector perflens
          test ! -e /usr/bin/perflens
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perflens-debian-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  build-release-assets:
    needs: debian-package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --all-groups --python 3.13 --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov=perflens --cov-fail-under=85
      - name: Build deterministic Python packages
        run: >-
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --no-sources --out-dir dist
      - name: Rebuild Python packages independently
        run: >-
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --no-sources --out-dir /tmp/perflens-python-reproducible
      - name: Verify reproducible wheel and source distribution
        run: >-
          uv run python scripts/verify_python_reproducibility.py
          --directory dist
          --reproducible-directory /tmp/perflens-python-reproducible
      - run: uv run --isolated --no-project --with dist/*.whl tests/package_smoke.py
      - run: uv run --isolated --no-project --with dist/*.tar.gz tests/package_smoke.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perflens-debian-packages
          path: dist
      - run: >-
          uv export --locked --no-dev --no-emit-project
          --preview-features sbom-export
          --format cyclonedx1.5 --output-file dist/sbom.cdx.json
      - run: uv run python scripts/prepare_release.py --tag "$GITHUB_REF_NAME"
      - name: Render beginner-friendly release notes
        run: >-
          uv run python scripts/render_release_notes.py
          --tag "$GITHUB_REF_NAME"
          --output release-notes.md
      - name: Transfer the verified release bundle to the publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perflens-release-bundle
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  attest-release-assets:
    needs: build-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perflens-release-bundle
          path: release-bundle
      - name: Attest every downloadable release asset
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "release-bundle/dist/*"

  github-release:
    needs: attest-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perflens-release-bundle
          path: release-bundle
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-bundle/dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --notes-file release-bundle/release-notes.md
          --title "PerfLens $GITHUB_REF_NAME"
