[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "perflens"
version = "0.3.2"
description = "Evidence-driven performance analysis toolkit for Linux applications"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "PerfLens contributors" }]
keywords = ["linux", "performance", "perf", "profiling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "jinja2>=3.1.6,<4",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pyelftools>=0.32,<1",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/link0-o/PerfLens"
Documentation = "https://github.com/link0-o/PerfLens#readme"
Repository = "https://github.com/link0-o/PerfLens.git"
Issues = "https://github.com/link0-o/PerfLens/issues"
Changelog = "https://github.com/link0-o/PerfLens/blob/main/CHANGELOG.md"

[project.scripts]
perflens = "perflens.cli.app:main"
perflens-mcp = "perflens.mcp.server:main"
perflens-collector = "perflens.collector_broker.server:main"
perflens-admin = "perflens.admin.app:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.135,<7",
  "pip-audit>=2.9,<3",
  "pyright[nodejs]>=1.1.403,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/perflens"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "perflens/schemas"
".agents/skills/perflens" = "perflens/_bundled/skills/perflens"
"packaging/collector" = "perflens/_bundled/collector"

[tool.hatch.build.targets.sdist]
include = [
  "/.agents",
  "/src",
  "/schemas",
  "/scripts",
  "/rust",
  "/Cargo.toml",
  "/Cargo.lock",
  "/rust-toolchain.toml",
  "/deny.toml",
  "/tests",
  "/uv.lock",
  "/docs",
  "/packaging",
  "/README.md",
  "/README.zh-CN.md",
  "/INSTALL.md",
  "/INSTALL.zh-CN.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/SECURITY.zh-CN.md",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S108"]
"src/perflens/distribution/onboarding.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --timeout=10"
testpaths = ["tests"]
markers = [
  "performance: deterministic performance and memory baselines",
]

[tool.coverage.run]
branch = true
source = ["perflens"]

[tool.coverage.report]
fail_under = 85
show_missing = true
